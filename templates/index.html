<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spam Detection System</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1f4037, #99f2c8);
        padding: 20px;
    }
    .card {
        background: #fff;
        border-radius: 16px;
        padding: 36px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    h1 {
        font-size: 24px;
        color: #1f4037;
        margin-bottom: 6px;
        text-align: center;
    }
    p.subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 24px;
        font-size: 14px;
    }
    textarea {
        width: 100%;
        min-height: 130px;
        padding: 14px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 15px;
        resize: vertical;
        outline: none;
        transition: border 0.2s;
    }
    textarea:focus { border-color: #1f4037; }
    button {
        width: 100%;
        margin-top: 16px;
        padding: 14px;
        background: #1f4037;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }
    button:hover { background: #16302a; }
    button:disabled { background: #999; cursor: not-allowed; }
    #result {
        margin-top: 24px;
        padding: 18px;
        border-radius: 10px;
        display: none;
        text-align: center;
    }
    #result.spam { background: #ffe3e3; border: 2px solid #ff5252; }
    #result.not-spam { background: #e3fff0; border: 2px solid #2ecc71; }
    #result.suspicious { background: #fff8e1; border: 2px solid #f9a825; }
    #result h2 { font-size: 22px; margin-bottom: 6px; }
    #result.spam h2 { color: #d32f2f; }
    #result.not-spam h2 { color: #1b7a43; }
    #result.suspicious h2 { color: #b8860b; }
    #result p { color: #444; font-size: 14px; margin-top: 4px; }
    .details {
        margin-top: 14px;
        text-align: left;
        font-size: 13px;
        color: #555;
        border-top: 1px solid rgba(0,0,0,0.1);
        padding-top: 12px;
    }
    .details strong { color: #222; }
    .details ul { margin: 4px 0 10px 18px; }
    .details li { word-break: break-all; margin-bottom: 3px; }
    .badge {
        display: inline-block;
        background: #fdecea;
        color: #c62828;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 20px;
        margin-left: 6px;
    }
    .error { color: #d32f2f; text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
    <div class="card">
        <h1>📩 Spam Detection System</h1>
        <p class="subtitle">Paste a message below to check if it's Spam or Not Spam</p>

        <textarea id="messageInput" placeholder="Type or paste your message here..."></textarea>
        <button id="checkBtn" onclick="checkSpam()">Check Message</button>

        <div id="result"></div>
        <div id="errorMsg" class="error"></div>
    </div>

<script>
async function checkSpam() {
    const input = document.getElementById('messageInput').value.trim();
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('errorMsg');
    const btn = document.getElementById('checkBtn');

    errorDiv.textContent = '';
    resultDiv.style.display = 'none';

    if (!input) {
        errorDiv.textContent = 'Please enter a message first.';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Checking...';

    try {
        const response = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: input })
        });

        const data = await response.json();

        if (data.error) {
            errorDiv.textContent = data.error;
        } else {
            let cssClass = 'not-spam';
            let icon = '✅';
            let label = 'Not Spam';

            if (data.prediction === 'Spam') {
                cssClass = 'spam'; icon = '🚫'; label = 'Spam Detected';
            } else if (data.prediction === 'Suspicious') {
                cssClass = 'suspicious'; icon = '⚠️'; label = 'Suspicious Message';
            }

            resultDiv.className = cssClass;

            let html = `
                <h2>${icon} ${label}</h2>
                <p>Model confidence: ${data.confidence}%</p>
                ${data.warning ? `<p><em>${data.warning}</em></p>` : ''}
            `;

            html += '<div class="details">';

            if (data.links_found && data.links_found.length > 0) {
                html += `<strong>Links found (${data.links_found.length}):</strong><ul>`;
                data.links_found.forEach(link => {
                    const isSuspicious = data.suspicious_links.some(s => s.url === link);
                    html += `<li>${link} ${isSuspicious ? '<span class="badge">Risky</span>' : ''}</li>`;
                });
                html += '</ul>';
            } else {
                html += '<p><strong>Links found:</strong> None</p>';
            }

            if (data.suspicious_keywords_found && data.suspicious_keywords_found.length > 0) {
                html += `<p><strong>Suspicious phrases:</strong> ${data.suspicious_keywords_found.join(', ')}</p>`;
            }

            html += `<p><strong>Phone number detected:</strong> ${data.has_phone_number ? 'Yes' : 'No'}</p>`;
            html += '</div>';

            resultDiv.innerHTML = html;
            resultDiv.style.display = 'block';
        }
    } catch (err) {
        errorDiv.textContent = 'Something went wrong. Please try again.';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Check Message';
    }
}
</script>
</body>
</html>
